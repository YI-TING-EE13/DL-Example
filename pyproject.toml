[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dl-example"
version = "0.2.0"
description = "Small, reproducible image-classification experiments for teaching"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "tqdm>=4.67,<5"]

[project.optional-dependencies]
cpu = ["torch==2.6.0", "torchvision==0.21.0"]
cuda = ["torch==2.6.0", "torchvision==0.21.0"]
tracking = ["wandb>=0.19,<1"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
dl-example = "dl_example.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dl_example"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
environments = ["sys_platform == 'win32' or sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu124", extra = "cuda" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu124", extra = "cuda" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
